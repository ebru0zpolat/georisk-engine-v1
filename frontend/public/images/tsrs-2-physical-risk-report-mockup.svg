<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">TSRS 2 compliant physical climate risk report mockup - GeoRisk Engine</title>
  <desc id="desc">A sample report page showing facility exposure score, TSRS 2 mapping, KGK audit evidence, satellite indicators, and methodology notes.</desc>
  <rect width="1200" height="760" fill="#07111f"/>
