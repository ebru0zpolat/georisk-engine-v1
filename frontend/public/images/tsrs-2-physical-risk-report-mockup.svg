  <text x="286" y="472" fill="#2ec990" font-family="Arial, sans-serif" font-size="15">Evidence</text>
  <text x="446" y="472" fill="#2ec990" font-family="Arial, sans-serif" font-size="15">Status</text>
  <text x="118" y="514" fill="#e8f2ff" font-family="Arial, sans-serif" font-size="16">TSRS 2 physical risk</text>
  <text x="286" y="514" fill="#9fb4cc" font-family="Arial, sans-serif" font-size="16">Flood / heat score</text>
  <text x="446" y="514" fill="#ef9f27" font-family="Arial, sans-serif" font-size="16">Review</text>
  <text x="118" y="556" fill="#e8f2ff" font-family="Arial, sans-serif" font-size="16">KGK audit evidence</text>
  <text x="286" y="556" fill="#9fb4cc" font-family="Arial, sans-serif" font-size="16">Method notes</text>
